<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Labelling</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6b66; --line:#deded8;
  --accent:#2f5d8a; --accent-ink:#ffffff; --mark:#ffe58a; --ok:#2e7d4f; --warn:#a0522d; --chip:#eef2f7;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161716; --panel:#1f201f; --ink:#e8e8e3; --muted:#a3a39c; --line:#363733;
    --accent:#7fb0e0; --accent-ink:#0f1a26; --mark:#6b5a12; --ok:#6cc58f; --warn:#e3a06b; --chip:#2a3138; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:600}
header .meta{color:var(--muted)}
header .sp{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
select,input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);height:calc(100% - 52px)}
#report{overflow:auto;padding:16px;border-right:1px solid var(--line)}
#report pre{white-space:pre-wrap;word-wrap:break-word;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0}
mark{background:var(--mark);color:inherit;border-radius:2px}
#form{overflow:auto;padding:12px 16px 80px}
.field{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.field.missing{border-color:var(--warn)}
.fh{display:flex;gap:8px;align-items:baseline}
.fh b{font-weight:600}
.kind{color:var(--muted);font-size:12px}
.fh .sp{flex:1}
.rule{color:var(--muted);font-size:12.5px;margin:4px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:6px 8px 4px 0}
.seg button{border:0;border-radius:0;padding:4px 9px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.ev{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{background:var(--chip);border-radius:12px;padding:2px 8px;font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;padding:0 0 0 6px;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.ok{color:var(--ok)} .warn{color:var(--warn)}
textarea{width:100%;min-height:54px}
@media (max-width: 820px){
  main{grid-template-columns:1fr;height:auto}
  #report{max-height:55vh;border-right:0;border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>
<header>
  <h1>Ovarian pathology report labelling</h1>
  <span class="meta" id="who"></span>
  <span class="sp"></span>
  <select id="jump" aria-label="Jump to case"></select>
  <button id="prev">&larr; Prev</button>
  <button id="next">Next &rarr;</button>
  <button id="done" class="primary">Mark done &amp; next</button>
  <button id="export">Export JSON</button>
  <label class="small"><input type="file" id="import" accept="application/json" hidden><button id="importBtn" type="button">Import</button></label>
  <span class="small" id="savestate"></span>
  <span class="small" id="timer" title="Active time on this case: counts only while this tab is visible and focused and you used mouse or keyboard in the last 2 minutes"></span>
</header>
<main>
  <section id="report" aria-label="Report text"><div class="small" id="caseinfo"></div><pre id="text"></pre></section>
  <section id="form" aria-label="Labels"></section>
</main>
<script type="application/json" id="payload">__PAYLOAD__</script>
<script>
(function(){
const P = JSON.parse(document.getElementById('payload').textContent);
const KEY = 'oac-label-' + P.set + '-' + P.annotator;
const STATUSES = [['answered','Answered'],['not_stated','Not stated'],['unsure','Unsure']];
let storageOk = true;
function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ storageOk=false; return null; } }
let state = load() || {labels:{}, idx:0};
let idx = Math.min(state.idx || 0, P.cases.length - 1);
// Active-time timer (tool v0.2). Time counts only while the tab is visible and focused and there was input
// (mouse, keys, scroll, selection) in the last IDLE_MS. Each tick adds at most MAX_STEP_MS, so a sleeping laptop
// or a throttled background tab cannot add a long gap. v0.1 counted wall-clock time from page load.
const IDLE_MS = 120000, TICK_MS = 1000, MAX_STEP_MS = 5000;
function activeStep(now, lastTick, lastInput, visible, focused){
  if(!visible || !focused || now - lastInput >= IDLE_MS) return 0;
  return Math.max(0, Math.min(now - lastTick, MAX_STEP_MS));
}
let lastTick = Date.now(), lastInput = Date.now(), pendingMs = 0;
function tick(){
  const now = Date.now();
  pendingMs += activeStep(now, lastTick, lastInput, document.visibilityState === 'visible', document.hasFocus());
  lastTick = now;
}
function fmt(sec){ const m = Math.floor(sec/60), s = sec % 60; return m + ':' + String(s).padStart(2,'0'); }
function showTimer(){
  const L = state.labels[P.cases[idx].case_id], base = (L && L.seconds) || 0;
  const idle = Date.now() - lastInput >= IDLE_MS || document.visibilityState !== 'visible' || !document.hasFocus();
  document.getElementById('timer').textContent = 'active ' + fmt(base + Math.floor(pendingMs/1000)) + (idle ? ' (paused)' : '');
}
['mousemove','mousedown','keydown','wheel','touchstart','selectionchange','focus'].forEach(ev =>
  document.addEventListener(ev, () => { lastInput = Date.now(); }, {capture:true, passive:true}));
document.addEventListener('scroll', () => { lastInput = Date.now(); }, {capture:true, passive:true});
setInterval(() => { tick(); showTimer(); }, TICK_MS);
function save(){
  state.idx = idx;
  try{ localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }catch(e){ storageOk = false; }
  document.getElementById('savestate').innerHTML = storageOk
    ? '<span class="ok">saved in this browser</span>' : '<span class="warn">browser storage off: export often</span>';
}
function lab(cid){ if(!state.labels[cid]) state.labels[cid] = {done:false, fields:{}, notes:'', seconds:0}; return state.labels[cid]; }
function cur(){ return P.cases[idx]; }
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderText(){
  const c = cur(), L = lab(c.case_id), t = c.text;
  const ranges = [];
  Object.values(L.fields).forEach(f => (f.evidence||[]).forEach(q => { const i = t.indexOf(q); if(i>=0) ranges.push([i, i+q.length]); }));
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged = [];
  ranges.forEach(r => { const m = merged[merged.length-1]; if(m && r[0] <= m[1]) m[1] = Math.max(m[1], r[1]); else merged.push(r.slice()); });
  let html = '', pos = 0;
  merged.forEach(([a,b]) => { html += esc(t.slice(pos,a)) + '<mark>' + esc(t.slice(a,b)) + '</mark>'; pos = b; });
  html += esc(t.slice(pos));
  document.getElementById('text').innerHTML = html;
  document.getElementById('caseinfo').textContent = 'Case ' + (idx+1) + ' / ' + P.cases.length + ' · ' + c.case_id +
    (L.done ? ' · done' : '');
}

function control(f, F){
  const dis = F.status !== 'answered' && F.status !== 'unsure';
  let el;
  if(f.kind === 'categorical' || f.kind === 'boolean'){
    el = document.createElement('select');
    const opts = f.kind === 'boolean' ? [['',''],['true','yes'],['false','no']] : [['','']].concat(f.allowed.map(a=>[a,a]));
    opts.forEach(([v,l]) => { const o = document.createElement('option'); o.value = v; o.textContent = l || '— value —'; el.appendChild(o); });
    el.value = F.value === undefined || F.value === null ? '' : String(F.value);
    el.onchange = () => { F.value = el.value === '' ? null : (f.kind === 'boolean' ? el.value === 'true' : el.value); save(); };
  } else {
    el = document.createElement('input'); el.type = 'number'; el.min = '0'; el.step = f.kind === 'count' ? '1' : '0.1';
    el.value = F.value === undefined || F.value === null ? '' : F.value;
    el.oninput = () => { const v = f.kind === 'count' ? parseInt(el.value,10) : parseFloat(el.value); F.value = isNaN(v) ? null : v; save(); };
  }
  el.disabled = dis;
  el.setAttribute('aria-label', f.name + ' value');
  return el;
}

function renderForm(){
  const c = cur(), L = lab(c.case_id), form = document.getElementById('form');
  form.innerHTML = '';
  P.fields.forEach(f => {
    const F = L.fields[f.name] || (L.fields[f.name] = {status:null, value:null, evidence:[]});
    const box = document.createElement('div'); box.className = 'field'; box.dataset.name = f.name;
    box.innerHTML = '<div class="fh"><b></b><span class="kind"></span><span class="sp"></span><button type="button" class="info">rule</button></div><div class="rule" hidden></div>';
    box.querySelector('b').textContent = f.name;
    box.querySelector('.kind').textContent = f.kind;
    box.querySelector('.rule').textContent = f.description + ' — ' + f.rule;
    box.querySelector('.info').onclick = () => { const r = box.querySelector('.rule'); r.hidden = !r.hidden; };
    const seg = document.createElement('div'); seg.className = 'seg';
    STATUSES.forEach(([s,l]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = l; if(F.status === s) b.className = 'on';
      b.onclick = () => { F.status = s; if(s === 'not_stated') F.value = null; save(); renderForm(); };
      seg.appendChild(b);
    });
    box.appendChild(seg);
    box.appendChild(control(f, F));
    const ev = document.createElement('div'); ev.className = 'ev';
    (F.evidence||[]).forEach((q,i) => {
      const chip = document.createElement('span'); chip.className = 'chip'; chip.title = q; chip.textContent = q;
      const x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label','remove evidence');
      x.onclick = () => { F.evidence.splice(i,1); save(); renderAll(); };
      chip.appendChild(x); ev.appendChild(chip);
    });
    const add = document.createElement('button'); add.type = 'button'; add.textContent = '+ evidence from selection'; add.className = 'small';
    add.onclick = () => {
      const s = (window.getSelection() || '').toString().trim();
      if(!s){ alert('Select text in the report first.'); return; }
      if(c.text.indexOf(s) < 0){ alert('Selection must be inside the report text (avoid crossing highlights).'); return; }
      F.evidence = F.evidence || []; F.evidence.push(s); save(); renderAll();
    };
    ev.appendChild(add);
    box.appendChild(ev);
    form.appendChild(box);
  });
  const notes = document.createElement('div'); notes.className = 'field';
  notes.innerHTML = '<div class="fh"><b>notes</b><span class="kind">free text: doubts, OCR problems, contradictions</span></div>';
  const ta = document.createElement('textarea'); ta.value = L.notes || ''; ta.oninput = () => { L.notes = ta.value; save(); };
  ta.setAttribute('aria-label','notes');
  notes.appendChild(ta); form.appendChild(notes);
}

function renderJump(){
  const j = document.getElementById('jump'); j.innerHTML = '';
  P.cases.forEach((c,i) => { const o = document.createElement('option'); o.value = i;
    o.textContent = (lab(c.case_id).done ? '✓ ' : '· ') + (i+1) + '  ' + c.case_id; j.appendChild(o); });
  j.value = idx;
  const n = P.cases.filter(c => lab(c.case_id).done).length;
  document.getElementById('who').textContent = P.annotator + ' · ' + P.set + ' set · ' + n + '/' + P.cases.length + ' done · guideline v' + P.guideline_version;
}
function renderAll(){ renderText(); renderForm(); renderJump(); }
function leave(){
  tick();
  const L = lab(cur().case_id), add = Math.round(pendingMs/1000);
  if(!L.timing) L.timing = (L.seconds || 0) > 0 ? 'wallclock_v0.1' : 'active_v0.2';  // v0.1 seconds are kept but flagged
  L.seconds = (L.seconds||0) + add; pendingMs = 0;
}
function go(i){ if(i<0 || i>=P.cases.length) return; leave(); idx = i; save(); renderAll(); document.getElementById('report').scrollTop = 0; document.getElementById('form').scrollTop = 0; }

function validate(){
  const L = lab(cur().case_id); let ok = true;
  P.fields.forEach(f => {
    const F = L.fields[f.name], box = document.querySelector('.field[data-name="'+f.name+'"]');
    const bad = !F || !F.status || (F.status === 'answered' && (F.value === null || F.value === undefined));
    box.classList.toggle('missing', bad); if(bad) ok = false;
  });
  return ok;
}
document.getElementById('prev').onclick = () => go(idx-1);
document.getElementById('next').onclick = () => go(idx+1);
document.getElementById('jump').onchange = e => go(parseInt(e.target.value,10));
document.getElementById('done').onclick = () => {
  if(!validate()){ alert('Every field needs a status; "Answered" needs a value.'); return; }
  lab(cur().case_id).done = true; leave(); save();
  const nxt = P.cases.findIndex((c,i) => i > idx && !lab(c.case_id).done);
  const any = P.cases.findIndex(c => !lab(c.case_id).done);
  go(nxt >= 0 ? nxt : (any >= 0 ? any : idx)); renderAll();
};
document.getElementById('export').onclick = () => {
  leave(); save();
  const out = {tool_version:P.tool_version, schema_version:P.schema_version, guideline_version:P.guideline_version,
    annotator:P.annotator, set:P.set, exported_utc:new Date().toISOString(), labels:state.labels};
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], {type:'application/json'}));
  a.download = 'labels_' + P.set + '_' + P.annotator + '.json'; a.click();
};
document.getElementById('importBtn').onclick = () => document.getElementById('import').click();
document.getElementById('import').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  f.text().then(t => { const d = JSON.parse(t); if(d.annotator !== P.annotator || d.set !== P.set){
      if(!confirm('File is for ' + d.annotator + '/' + d.set + '. Import anyway?')) return; }
    state.labels = d.labels || {}; save(); renderAll(); });
};
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden'){ leave(); save(); } });
window.addEventListener('pagehide', () => { leave(); save(); });
save(); renderAll(); showTimer();
})();
</script>
</body>
</html>
