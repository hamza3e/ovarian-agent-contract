[project]
name = "ovarian-agent-contract"
version = "0.1.0"
description = "Agent evidence contract, a calibrated pathology-report agent and an agent evaluation protocol on public TCGA-OV data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "rapidfuzz>=3.6",
]

[project.optional-dependencies]
eval = ["scikit-learn>=1.4", "matplotlib>=3.8"]
api = ["anthropic>=2.10"]  # Claude API comparison arm
gpu = ["vllm"]  # Colab only; the notebook pins the version it ran with
agent = [
    "langgraph>=1.2.24",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "jsonschema>=4.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oac"]

[tool.ruff]
extend-exclude = ["notebooks"]  # Colab cells use shell magics
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
