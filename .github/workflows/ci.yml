name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync --extra eval --extra api
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python -m oac.smoke
      - name: contract schema is up to date
        run: |
          uv run python -m oac.contract --schema /tmp/schema.json
          diff /tmp/schema.json contract/agent_output.schema.json
